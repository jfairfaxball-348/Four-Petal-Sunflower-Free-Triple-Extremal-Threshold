name: P001B integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Administrative integrity
        run: python scripts/validate.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
